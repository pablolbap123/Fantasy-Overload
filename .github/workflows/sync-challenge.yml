name: Sync Challenge Place

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Fetch latest Challenge snapshot
        run: npm run sync:challenge

      - name: Apply database schema and functions
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260520102000_overload_scoring_columns.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260520113000_sync_owned_prices.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260520114500_realtime_publication.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260520130000_market_listing_delete_league_squad_points.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260520133000_cancel_market_listing.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260520134500_challenge_live_status.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/policies.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/rpc.sql

      - name: Upsert Challenge data and refresh fantasy leagues
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/seed.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          select set_config('request.jwt.claim.role', 'service_role', false);
          select public.sync_all_leagues_from_official();
          select public.resolve_all_market_auctions();
          SQL
          SNAPSHOT_HASH="$(sha256sum supabase/seed.sql | awk '{print $1}')"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<SQL
          insert into public.challenge_sync_status (
            id,
            source_url,
            status,
            message,
            snapshot_hash,
            last_checked_at,
            last_changed_at,
            updated_at
          )
          values (
            'overload-series',
            'https://challenge.place/c/68486e1155cbb0e036a0559f/stage/69de85f89e7d357d88be816c',
            'ok',
            'Snapshot programado de Challenge aplicado en web y movil.',
            '$SNAPSHOT_HASH',
            now(),
            now(),
            now()
          )
          on conflict (id) do update
          set status = excluded.status,
              message = excluded.message,
              snapshot_hash = excluded.snapshot_hash,
              last_checked_at = excluded.last_checked_at,
              last_changed_at = excluded.last_changed_at,
              updated_at = excluded.updated_at;
          SQL
