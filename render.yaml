services:
  - type: worker
    name: overload-challenge-manual-sync
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    envVars:
      - key: SUPABASE_DB_URL
        sync: false
      - key: CHALLENGE_REQUEST_POLL_MS
        value: "15000"
      - key: CHALLENGE_AUTO_SYNC_MS
        value: "300000"
